# Tweet Vault MCP endpoint (POST /mcp) and its OAuth routes (/oauth/, /.well-known/oauth-*) for the LIVE nginx site. Not applied automatically: see
# RUNBOOK.md "Turn on the MCP endpoint". The live file is Certbot-managed, so add these by hand
# (or with a dated backup and `nginx -t`), never by replacing the file.
#
# 1) At the top of /etc/nginx/sites-available/vault.example.com, next to the other limit_req_zone
#    lines (http level, outside any server block):
#
#      limit_req_zone $binary_remote_addr zone=vault_mcp:10m rate=60r/m;
#      limit_req_zone $binary_remote_addr zone=vault_oauth:10m rate=60r/m;
#
# 2) Inside the HTTPS server block (the one with "listen 443 ssl"), before "location / {" (all three blocks):

    # MCP for Claude: 60 a minute per IP at the edge (the app also limits 60 a minute per key),
    # one small JSON-RPC message per request, JSON answers only (no streaming)
    location = /mcp {
        limit_req zone=vault_mcp burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        client_body_timeout 15s;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # OAuth for claude.ai custom connectors (see server/src/oauth.js): discovery, registration, the consent
    # page, tokens and revocation. Small form or JSON bodies only. The app limits registrations to 20 an hour
    # and token calls to 60 a minute per IP on its own; this adds an edge limit in front.
    # The server-level headers (X-Frame-Options DENY, Referrer-Policy no-referrer, ...) still apply here:
    # no add_header in these blocks, on purpose. With no-referrer, browsers send "Origin: null" on the
    # consent form's POST; the app then checks Sec-Fetch-Site instead (see sameOriginPost in oauth.js).
    location /oauth/ {
        limit_req zone=vault_oauth burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }
    location ^~ /.well-known/oauth- {
        limit_req zone=vault_oauth burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }
