# Tweet Vault (public). Installed by install-public-vault.sh; Certbot adds the 443 block.
limit_req_zone $binary_remote_addr zone=vault_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vault_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=vault_voice:10m rate=240r/m;

server {
    server_name vault.example.com;
    server_tokens off;

    # while the app restarts (a deploy) or is down, show a calm page instead of nginx's own error page
    error_page 502 503 504 = @down;
    location @down {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="20"><title>Tweet Vault</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 "Segoe UI",Arial,sans-serif;background:#FBFDFA;color:#16202A}main{max-width:420px;padding:32px;text-align:center}h1{font-weight:400;font-size:24px;color:#1F5FBF}p{color:#55616B}@media (prefers-color-scheme:dark){body{background:#0E1317;color:#E3E8EC}h1{color:#7EAEF2}p{color:#9BA7B1}}</style></head><body><main><h1>Tweet Vault is restarting</h1><p>It will be back in a few seconds. This page reloads by itself.</p></main></body></html>';
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    client_max_body_size 256k;
    client_body_timeout 15s;
    limit_req_status 429;

    # sign-in, two-step code and phone pairing: 10 per minute per IP
    location ~ ^/api/(login|login/mfa|pair)$ {
        limit_req zone=vault_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # voice note uploads (server/src/voice.js): audio in pieces of 512 KB, so a bigger body and a longer
    # body timeout here only; everything else keeps the 256k / 15 s limits above
    # no trailing slash: with one, nginx would redirect the bare /api/voice (start, list) to /api/voice/
    location ^~ /api/voice {
        client_max_body_size 1m;
        client_body_timeout 60s;
        limit_req zone=vault_voice burst=120 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=vault_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
