      "publisher": { "@type": "Organization", "name": "Field Notes" },
      "articleBody": "For most of my side projects the database is the part I think about least, and that is exactly why I keep choosing SQLite.\n\nIt is one file. Backups are a copy. There is no server to patch, no port to firewall and no connection pool to tune. When a project grows, the write-ahead log handles more concurrent readers than any of my projects has ever had.\n\nThe usual objection is that it does not scale. In practice the limit is a single writer at a time, and a single writer can do tens of thousands of small transactions a second on a cheap VPS. That is more than enough for anything with fewer than a few million users.\n\nThe one thing I do miss is a good story for running migrations from several processes at once, so I always take a lock before upgrading the schema."
